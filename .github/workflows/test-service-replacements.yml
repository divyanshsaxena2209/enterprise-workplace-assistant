name: Test AWS service replacement branch

on:
  push:
    branches:
      - aws-service-replacements
      - aws-service-review-fixes
      - cognito-staging-integration
    paths:
      - "backend/**"
      - ".github/workflows/test-service-replacements.yml"
      - ".github/workflows/build-backend-ecr.yml"
      - "docs/COGNITO_STAGING_IMPLEMENTATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-service-replacements:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check fastapi pydantic-settings pytest supabase pyjwt cryptography email-validator
      - name: Compile backend and test files
        run: python -m compileall -q backend/app backend/tests
      - name: Run isolated service replacement tests
        run: PYTHONPATH=backend pytest -q backend/tests/test_object_storage.py backend/tests/test_role_permissions.py backend/tests/test_jwt_verification.py backend/tests/test_cognito_security.py
