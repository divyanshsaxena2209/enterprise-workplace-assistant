name: Test AWS service replacement branch

on:
  push:
    branches:
      - aws-service-replacements
      - aws-service-review-fixes
      - cognito-staging-integration
    paths:
      - "backend/**"
      - ".github/workflows/test-service-replacements.yml"
      - ".github/workflows/build-backend-ecr.yml"
      - "docs/COGNITO_STAGING_IMPLEMENTATION.md"
      - "supabase/migrations/**"
      - "frontend/**"
      - "infra/cognito/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-service-replacements:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test Cognito pre-token trigger
        run: node --test infra/cognito/pre-token-generation/test.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-publishable-key
          NEXT_PUBLIC_API_URL: https://example.invalid
        run: npm run build
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check fastapi pydantic-settings pytest supabase pyjwt cryptography email-validator "psycopg[binary]"
      - name: Compile backend and test files
        run: python -m compileall -q backend/app backend/tests
      - name: Run isolated service replacement tests
        run: PYTHONPATH=backend pytest -q backend/tests/test_object_storage.py backend/tests/test_role_permissions.py backend/tests/test_jwt_verification.py backend/tests/test_cognito_security.py backend/tests/test_identity_resolver.py backend/tests/test_cognito_identity_repository.py backend/tests/test_cognito_rls_migration.py
