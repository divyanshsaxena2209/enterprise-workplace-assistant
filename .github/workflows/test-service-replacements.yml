name: Test AWS service replacement branch

on:
  push:
    branches:
      - aws-service-replacements
    paths:
      - "backend/**"
      - ".github/workflows/test-service-replacements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-object-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check fastapi pydantic-settings pytest
      - name: Run isolated S3 storage tests
        run: PYTHONPATH=backend pytest -q backend/tests/test_object_storage.py
