name: Build backend image to Amazon ECR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and push backend container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::745531385877:role/GitHubActions-EWA-Deploy
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            745531385877.dkr.ecr.ap-south-1.amazonaws.com/enterprise-workplace-assistant-backend:latest
            745531385877.dkr.ecr.ap-south-1.amazonaws.com/enterprise-workplace-assistant-backend:${{ github.sha }}
